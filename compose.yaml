name: ${COMPOSE_PROJECT_NAME:-nova-laravel-starter}

x-sail-app: &sail-app
  build:
    context: ./vendor/laravel/sail/runtimes/8.2
    dockerfile: Dockerfile
    args:
      WWWGROUP: "${WWWGROUP:-1000}"
  image: sail-8.2/app
  extra_hosts:
    - host.docker.internal:host-gateway
  environment:
    WWWUSER: "${WWWUSER:-1000}"
    LARAVEL_SAIL: 1
    XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
    XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
    IGNITION_LOCAL_SITES_PATH: "${PWD}"
  volumes:
    - .:/var/www/html
  networks:
    - sail
  depends_on:
    mysql:
      condition: service_healthy

services:
  laravel.test:
    <<: *sail-app
    ports:
      - "127.0.0.1:${APP_PORT:-8014}:80"
      - "127.0.0.1:${VITE_PORT:-5187}:${VITE_PORT:-5187}"
    restart: unless-stopped

  mysql:
    image: mysql:5.7
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-33075}:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: "${DB_DATABASE:-nova_laravel_starter}"
      MYSQL_USER: "${DB_USERNAME:-sail}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-sail}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_password}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --explicit-defaults-for-timestamp=1
    volumes:
      - sail-mysql:/var/lib/mysql
    networks:
      - sail
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  queue:
    <<: *sail-app
    command: php artisan queue:work --sleep=3 --tries=1 --timeout=1800 --max-time=3600
    stop_grace_period: 31m
    profiles:
      - queue
    restart: unless-stopped

  scheduler:
    <<: *sail-app
    command: php artisan schedule:work
    profiles:
      - scheduled
    restart: unless-stopped

networks:
  sail:
    driver: bridge

volumes:
  sail-mysql:
    driver: local
